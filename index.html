<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Messenger - Secure E2EE</title>
    
    <!-- Thư viện Supabase JS & CryptoJS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #f0f2f5;
            color: #050505;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        /* --- MÀN HÌNH ĐĂNG NHẬP (LOGIN MODAL) --- */
        #login-modal {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(255, 255, 255, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }
        .login-card {
            background: #fff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            text-align: center;
        }
        .login-card h2 {
            font-size: 22px;
            font-weight: 700;
            color: #050505;
        }
        .login-card p {
            font-size: 13px;
            color: #65676b;
            margin-bottom: 8px;
        }
        .login-card input {
            width: 100%;
            padding: 12px 16px;
            background: #f0f2f5;
            border: 1px solid #ccd0d5;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }
        .login-card input:focus {
            border-color: #0084ff;
        }
        .login-card button {
            width: 100%;
            padding: 12px;
            background: #0084ff;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .login-card button:hover {
            background: #166fe5;
        }

        /* --- GIAO DIỆN CHAT CHÍNH (ẨN KHI CHƯA LOGIN) --- */
        .messenger-container {
            display: none; /* Hiện sau khi đăng nhập */
            width: 100vw;
            height: 100vh;
            background: #fff;
        }

        /* Cột trái */
        .sidebar {
            width: 320px;
            border-right: 1px solid #e4e6eb;
            display: flex;
            flex-direction: column;
            background: #fff;
        }
        .sidebar-header {
            padding: 20px 16px;
            border-bottom: 1px solid #e4e6eb;
        }
        .sidebar-header h2 {
            font-size: 22px;
            font-weight: 700;
        }
        .chat-list {
            flex: 1;
            padding: 8px;
        }
        .chat-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 8px;
            background: #e6f2ff;
        }
        .avatar {
            width: 44px;
            height: 44px;
            background: #0084ff;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px;
            flex-shrink: 0;
        }
        .chat-name {
            font-weight: 600;
            font-size: 15px;
            color: #050505;
        }
        .chat-preview {
            font-size: 13px;
            color: #65676b;
        }

        /* Cột phải */
        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #fff;
        }
        .chat-main-header {
            padding: 12px 16px;
            border-bottom: 1px solid #e4e6eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .user-profile .avatar {
            width: 38px;
            height: 38px;
            font-size: 14px;
        }
        .current-user-tag {
            font-size: 12px;
            background: #e4e6eb;
            padding: 4px 8px;
            border-radius: 12px;
            font-weight: 600;
            color: #333;
        }

        /* Khung tin nhắn */
        .chat-body {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #ffffff;
        }
        .msg {
            max-width: 65%;
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.4;
            word-break: break-word;
        }
        .msg.received {
            background: #f0f2f5;
            color: #050505;
            align-self: flex-start;
        }
        .msg.sent {
            background: #0084ff;
            color: #fff;
            align-self: flex-end;
        }
        .msg .sender {
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 2px;
            display: block;
            opacity: 0.8;
        }

        /* Ô nhập tin nhắn */
        .chat-footer {
            padding: 12px 16px;
            background: #fff;
            display: flex;
            align-items: center;
            gap: 12px;
            border-top: 1px solid #e4e6eb;
        }
        .chat-footer input {
            flex: 1;
            padding: 10px 16px;
            background: #f0f2f5;
            border: none;
            border-radius: 20px;
            font-size: 14px;
            outline: none;
        }
        .send-btn {
            background: none;
            border: none;
            color: #0084ff;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            padding: 6px 10px;
        }
        .send-btn:hover {
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <!-- MÀN HÌNH ĐĂNG NHẬP -->
    <div id="login-modal">
        <div class="login-card">
            <h2>🔒 Secret Messenger</h2>
            <p>Nhập tên tài khoản và mã khóa để tham gia phòng chat bảo mật</p>
            <input type="text" id="usernameInput" placeholder="Tên hiển thị của bạn (Ví dụ: Hungdz)...">
            <input type="password" id="modalKeyInput" placeholder="Secret Key (Mã giải mã)..." value="Secret123">
            <button id="loginBtn">Vào phòng chat</button>
        </div>
    </div>

    <!-- GIAO DIỆN CHAT CHÍNH -->
    <div class="messenger-container" id="messengerApp">
        <!-- Cột trái: Gọn gàng -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>Đoạn chat</h2>
            </div>
            <div class="chat-list">
                <div class="chat-item">
                    <div class="avatar">🔒</div>
                    <div>
                        <div class="chat-name">Phòng Bí Mật Chung</div>
                        <div class="chat-preview">E2EE Active</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Cột phải -->
        <div class="chat-main">
            <div class="chat-main-header">
                <div class="user-profile">
                    <div class="avatar">🔒</div>
                    <div>
                        <div class="chat-name">Phòng Bí Mật Chung</div>
                        <div style="font-size: 12px; color: #65676b;">Bảo mật đầu cuối (AES)</div>
                    </div>
                </div>
                <div class="current-user-tag" id="userTag">Tài khoản: Khách</div>
            </div>

            <!-- Khung chứa tin nhắn -->
            <div class="chat-body">
                <div class="msg received">
                    <span class="sender">System</span>
                    Đang kết nối hệ thống...
                </div>
            </div>

            <!-- Ô nhập tin nhắn -->
            <div class="chat-footer">
                <input type="text" id="messageInput" placeholder="Aa Nhập tin nhắn...">
                <button class="send-btn" id="sendButton">Gửi</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://bgobcellahiepuarhjls.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_QIZIRzeLhQG0u8990fShwA_ays79eZz'; // Key của ông giáo
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const loginModal = document.getElementById('login-modal');
        const messengerApp = document.getElementById('messengerApp');
        const loginBtn = document.getElementById('loginBtn');
        const usernameInput = document.getElementById('usernameInput');
        const modalKeyInput = document.getElementById('modalKeyInput');
        const userTag = document.getElementById('userTag');

        const chatBody = document.querySelector('.chat-body');
        const inputMsg = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendButton');

        let myName = "";
        let secretKey = "";

        // Sự kiện bấm nút Đăng nhập
        loginBtn.addEventListener('click', () => {
            const name = usernameInput.value.trim();
            const key = modalKeyInput.value.trim();

            if (!name || !key) {
                alert("Vui lòng nhập đầy đủ tên và Secret Key!");
                return;
            }

            myName = name;
            secretKey = key;

            userTag.innerText = "Tài khoản: " + myName;

            // Ẩn modal login, hiện app chat
            loginModal.style.display = 'none';
            messengerApp.style.display = 'flex';

            // Tải tin nhắn và lắng nghe realtime
            fetchMessages();
            subscribeRealtime();
        });

        // 1. Tải lịch sử tin nhắn
        async function fetchMessages() {
            let { data, error } = await supabaseClient
                .from('messages')
                .select('*')
                .order('created_at', { ascending: true });

            if (error) {
                console.error('Lỗi tải tin nhắn:', error);
                return;
            }

            chatBody.innerHTML = '';
            if (data && data.length > 0) {
                data.forEach(msg => appendMessage(msg.sender, msg.content));
            } else {
                appendMessage("System", "Phòng chat trống. Hãy gửi tin nhắn đầu tiên!");
            }
        }

        // 2. Hiển thị tin nhắn (Giải mã E2EE)
        function appendMessage(sender, encryptedContent) {
            let decryptedContent = encryptedContent;

            if (sender !== "System") {
                try {
                    let bytes = CryptoJS.AES.decrypt(encryptedContent, secretKey);
                    let originalText = bytes.toString(CryptoJS.enc.Utf8);
                    if (originalText) {
                        decryptedContent = originalText;
                    } else {
                        decryptedContent = "🔒 [Sai Secret Key giải mã]";
                    }
                } catch (e) {
                    decryptedContent = "🔒 [Lỗi giải mã]";
                }
            }

            const msgDiv = document.createElement('div');
            msgDiv.className = `msg ${sender === myName ? 'sent' : 'received'}`;
            msgDiv.innerHTML = `<span class="sender">${sender}</span>${decryptedContent}`;
            chatBody.appendChild(msgDiv);
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        // 3. Gửi tin nhắn lên Supabase
        async function sendMessage() {
            const text = inputMsg.value.trim();
            if (!text) return;

            const encryptedContent = CryptoJS.AES.encrypt(text, secretKey).toString();

            const { error } = await supabaseClient
                .from('messages')
                .insert([{ sender: myName, content: encryptedContent }]);

            if (error) {
                alert('Lỗi gửi tin nhắn: ' + error.message);
            } else {
                inputMsg.value = '';
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        inputMsg.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // 4. Lắng nghe Realtime
        function subscribeRealtime() {
            supabaseClient
                .channel('public:messages')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
                    appendMessage(payload.new.sender, payload.new.content);
                })
                .subscribe();
        }
    </script>
</body>
</html>
