<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Messenger</title>
    
    <!-- Thư viện Supabase JS & CryptoJS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #f0f2f5;
            color: #050505;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Khung tổng thể kiểu Messenger */
        .messenger-container {
            display: flex;
            width: 100vw;
            height: 100vh;
            background: #fff;
        }

        /* --- CỘT TRÁI: DANH SÁCH ĐOẠN CHAT --- */
        .sidebar {
            width: 340px;
            border-right: 1px solid #e4e6eb;
            display: flex;
            flex-direction: column;
            background: #fff;
        }
        .sidebar-header {
            padding: 20px 16px 10px 16px;
        }
        .sidebar-header h2 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 12px;
        }
        .search-box input {
            width: 100%;
            padding: 8px 12px 8px 36px;
            background: #f0f2f5;
            border: none;
            border-radius: 20px;
            font-size: 14px;
            outline: none;
        }
        .search-wrapper {
            position: relative;
        }
        .search-wrapper::before {
            content: "🔍";
            position: absolute;
            left: 12px;
            top: 8px;
            font-size: 13px;
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }
        .chat-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .chat-item:hover {
            background: #f2f2f2;
        }
        .chat-item.active {
            background: #e6f2ff;
        }
        .avatar {
            width: 48px;
            height: 48px;
            background: #0084ff;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            flex-shrink: 0;
        }
        .chat-info {
            overflow: hidden;
        }
        .chat-name {
            font-weight: 600;
            font-size: 15px;
            color: #050505;
        }
        .chat-preview {
            font-size: 13px;
            color: #65676b;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* --- CỘT PHẢI: KHUNG CHAT CHÍNH --- */
        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #fff;
        }
        .chat-main-header {
            padding: 12px 16px;
            border-bottom: 1px solid #e4e6eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
        }
        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .user-profile .avatar {
            width: 40px;
            height: 40px;
            font-size: 15px;
        }
        .key-setting input {
            padding: 6px 12px;
            border: 1px solid #ccd0d5;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
            background: #f0f2f5;
        }

        /* Khu vực hiển thị tin nhắn */
        .chat-body {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #ffffff;
        }
        .msg {
            max-width: 65%;
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.4;
            word-break: break-word;
        }
        .msg.received {
            background: #f0f2f5;
            color: #050505;
            align-self: flex-start;
        }
        .msg.sent {
            background: #0084ff;
            color: #fff;
            align-self: flex-end;
        }
        .msg .sender {
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 2px;
            display: block;
            opacity: 0.8;
        }

        /* Ô nhập tin nhắn chân trang */
        .chat-footer {
            padding: 12px 16px;
            background: #fff;
            display: flex;
            align-items: center;
            gap: 12px;
            border-top: 1px solid #e4e6eb;
        }
        .chat-footer input {
            flex: 1;
            padding: 10px 16px;
            background: #f0f2f5;
            border: none;
            border-radius: 20px;
            font-size: 14px;
            outline: none;
        }
        .send-btn {
            background: none;
            border: none;
            color: #0084ff;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            padding: 6px 10px;
        }
        .send-btn:hover {
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <div class="messenger-container">
        <!-- Cột trái: Danh sách đoạn chat -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>Đoạn chat</h2>
                <div class="search-wrapper">
                    <input type="text" placeholder="Tìm kiếm trên Secret Chat">
                </div>
            </div>
            <div class="chat-list">
                <div class="chat-item active">
                    <div class="avatar">🔒</div>
                    <div class="chat-info">
                        <div class="chat-name">Phòng Bí Mật Chung</div>
                        <div class="chat-preview">Mã hóa E2EE bảo mật tuyệt đối</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Cột phải: Khung chat chính -->
        <div class="chat-main">
            <div class="chat-main-header">
                <div class="user-profile">
                    <div class="avatar">🔒</div>
                    <div>
                        <div class="chat-name">Phòng Bí Mật Chung</div>
                        <div style="font-size: 12px; color: #65676b;">Đang hoạt động • E2EE Active</div>
                    </div>
                </div>
                <div class="key-setting">
                    <input type="password" id="secretKey" placeholder="🔑 Nhập Secret Key..." value="Secret123">
                </div>
            </div>

            <!-- Khung chứa tin nhắn -->
            <div class="chat-body">
                <div class="msg received">
                    <span class="sender">System</span>
                    Đang tải dữ liệu phòng chat...
                </div>
            </div>

            <!-- Ô nhập tin nhắn -->
            <div class="chat-footer">
                <input type="text" id="messageInput" placeholder="Aa Nhập tin nhắn...">
                <button class="send-btn" id="sendButton">Gửi</button>
            </div>
        </div>
    </div>

    <script>
        // Cấu hình Supabase của ông giáo
        const SUPABASE_URL = 'https://bgobcellahiepuarhjls.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_QIZIRzeLhQG0u8990fShwA_ays79eZz'; // Thay key của ông giáo vào đây nếu cần
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const chatBody = document.querySelector('.chat-body');
        const inputMsg = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendButton');
        const keyInput = document.getElementById('secretKey');

        const myName = "User_" + Math.floor(Math.random() * 1000);

        // 1. Tải lịch sử tin nhắn
        async function fetchMessages() {
            let { data, error } = await supabaseClient
                .from('messages')
                .select('*')
                .order('created_at', { ascending: true });

            if (error) {
                console.error('Lỗi tải tin nhắn:', error);
                return;
            }

            chatBody.innerHTML = '';
            if (data && data.length > 0) {
                data.forEach(msg => appendMessage(msg.sender, msg.content));
            } else {
                appendMessage("System", "Phòng chat trống. Hãy gửi tin nhắn đầu tiên!");
            }
        }

        // 2. Hiển thị tin nhắn (Giải mã E2EE)
        function appendMessage(sender, encryptedContent) {
            const secretKey = keyInput.value;
            let decryptedContent = encryptedContent;

            if (sender !== "System") {
                try {
                    let bytes = CryptoJS.AES.decrypt(encryptedContent, secretKey);
                    let originalText = bytes.toString(CryptoJS.enc.Utf8);
                    if (originalText) {
                        decryptedContent = originalText;
                    } else {
                        decryptedContent = "🔒 [Sai Secret Key giải mã]";
                    }
                } catch (e) {
                    decryptedContent = "🔒 [Lỗi giải mã]";
                }
            }

            const msgDiv = document.createElement('div');
            msgDiv.className = `msg ${sender === myName ? 'sent' : 'received'}`;
            msgDiv.innerHTML = `<span class="sender">${sender}</span>${decryptedContent}`;
            chatBody.appendChild(msgDiv);
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        // 3. Gửi tin nhắn lên Supabase
        async function sendMessage() {
            const text = inputMsg.value.trim();
            const secretKey = keyInput.value;
            if (!text || !secretKey) return;

            const encryptedContent = CryptoJS.AES.encrypt(text, secretKey).toString();

            const { error } = await supabaseClient
                .from('messages')
                .insert([{ sender: myName, content: encryptedContent }]);

            if (error) {
                alert('Lỗi gửi tin nhắn: ' + error.message);
            } else {
                inputMsg.value = '';
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        inputMsg.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // 4. Lắng nghe Realtime
        supabaseClient
            .channel('public:messages')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
                appendMessage(payload.new.sender, payload.new.content);
            })
            .subscribe();

        fetchMessages();
    </script>
</body>
</html>
